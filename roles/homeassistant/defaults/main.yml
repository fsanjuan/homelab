---
# Pinned on purpose: Home Assistant ships breaking changes every month.
# Bump these deliberately, read the release notes, then re-run the playbook.
homeassistant_version: "2026.11.2"
matter_server_version: "1.6.0"

homeassistant_dir: /opt/homeassistant

# Port Home Assistant listens on (host networking). Traefik serves it over
# HTTPS on 8123; this one is plain HTTP and only meant for Traefik.
homeassistant_internal_port: 8124

# Values written to secrets.yaml, referenced in YAML config as `!secret <key>`.
# Define real values in the vault (group_vars/all/vault.yml), never here.
homeassistant_secrets: {}
