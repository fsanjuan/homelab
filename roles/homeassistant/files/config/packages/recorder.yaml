# Keeps Home Assistant's own history database small. Long-term history lives in
# Prometheus (see prometheus.yaml); Home Assistant's long-term statistics
# (hourly min/max/mean, energy totals) are kept regardless of purge_keep_days.
recorder:
  purge_keep_days: 14
  exclude:
    # Diagnostic sensors that change constantly and nobody graphs
    entity_globs:
      - sensor.*_rssi
      - sensor.*_signal_strength
      - sensor.*_wifi_signal
      - sensor.*_uptime
      - sensor.*_last_restart*
