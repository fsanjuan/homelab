---
- name: Create monitoring directory
  ansible.builtin.file:
    path: /opt/monitoring
    state: directory
    mode: '0755'

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/monitoring/provisioning/datasources
    - /opt/monitoring/provisioning/dashboards

- name: Template Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus.yml
    mode: '0644'
  notify: Restart Prometheus

# Prometheus runs as nobody (65534)
- name: Write Home Assistant token for Prometheus
  ansible.builtin.copy:
    content: "{{ homeassistant_api_token }}"
    dest: /opt/monitoring/homeassistant_token
    owner: '65534'
    group: '65534'
    mode: '0400'
  when: homeassistant_api_token is defined
  no_log: true
  notify: Restart Prometheus

- name: Copy Grafana datasource provisioning
  ansible.builtin.copy:
    src: datasources.yml
    dest: /opt/monitoring/provisioning/datasources/datasources.yml
    mode: '0644'
  notify: Restart Grafana

- name: Copy Grafana dashboard provisioning
  ansible.builtin.copy:
    src: dashboards.yml
    dest: /opt/monitoring/provisioning/dashboards/dashboards.yml
    mode: '0644'
  notify: Restart Grafana

- name: Copy Grafana cadvisor dashboard
  ansible.builtin.copy:
    src: cadvisor.json
    dest: /opt/monitoring/provisioning/dashboards/cadvisor.json
    mode: '0644'
  notify: Restart Grafana

- name: Copy Grafana Home Assistant dashboard
  ansible.builtin.copy:
    src: homeassistant.json
    dest: /opt/monitoring/provisioning/dashboards/homeassistant.json
    mode: '0644'
  notify: Restart Grafana

- name: Template docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'

- name: Start monitoring stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/monitoring
  changed_when: false
